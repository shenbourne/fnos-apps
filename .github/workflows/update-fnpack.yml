name: Update fnpack.json

on:
  # GitHub 默认禁用 fork 上的 schedule 触发；取消 fork（转为独立仓库）后定时任务自动生效
  schedule:
    - cron: '23 8 * * *'   # 每天 08:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fnpack.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/generate-fnpack.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          if git diff --cached --quiet; then
            echo "fnpack.json is up to date"
          else
            git commit -m "chore: update fnpack.json for FnDepot [skip ci]"
            git push
          fi
